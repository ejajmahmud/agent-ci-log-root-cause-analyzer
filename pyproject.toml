[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ci-log-root-cause-analyzer"
version = "0.1.0"
description = "RegEx and clustering log parser distilling 5,000-line CI/CD build failures down to the exact failing assertion and stack frame"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-ci-log-root-cause-analyzer = "agent_ci_log_root_cause_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ci_log_root_cause_analyzer*"]
